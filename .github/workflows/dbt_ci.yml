name: dbt ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DBT_PROFILES_DIR: .

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: install dbt
        run: pip install dbt-core dbt-duckdb

      - run: dbt deps
      - run: dbt seed --target ci
      - run: dbt run --target ci
      - run: dbt test --target ci --store-failures

      - name: generate docs
        if: github.ref == 'refs/heads/main'
        run: dbt docs generate --target ci

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            target/manifest.json
            target/run_results.json
            target/catalog.json
          retention-days: 30

      - name: test summary
        if: always()
        run: |
          [ -f target/run_results.json ] || exit 0
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          results = json.load(open("target/run_results.json"))["results"]
          passed = sum(r["status"] in ("pass", "success") for r in results)
          print("| nodes | passed | failed |")
          print("|---|---|---|")
          print(f"| {len(results)} | {passed} | {len(results) - passed} |")
          PY

  slim-ci:
    name: modified models only
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: install dbt
        run: pip install dbt-core dbt-duckdb

      - run: dbt deps
      - run: dbt seed --target ci

      - name: run the models touched by this pr and their children
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep "^models/" | sed 's|models/||;s|\.sql$||' | xargs -I{} echo "+{}+" | tr '\n' ' ')
          if [ -z "$CHANGED" ]; then
            dbt run --target ci
          else
            echo "modified: $CHANGED"
            dbt run --target ci --select $CHANGED
            dbt test --target ci --select $CHANGED
          fi
